<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTERGEN Payment System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Информационный текст: меняется при выборе языка -->
    <div id="payment-info" class="payment-info">
        <p id="payment-info-text">Для того, чтобы внести оплату за ключ активации, для программы MASTERGEN ANALYZER, выберите, удобный для вас способ оплаты и скопируйте адрес кошелька.</p>
    </div>


    <button id="btn-btc" class="crypto-btn" type="button" data-currency="BTC">
        <img src="assets/bt.png" alt="" draggable="false">
    </button>

    <button id="btn-eth" class="crypto-btn" type="button" data-currency="ETH">
        <img src="assets/eth.png" alt="" draggable="false">
    </button>

    <button id="btn-solana" class="crypto-btn" type="button" data-currency="SOL">
        <img src="assets/solana.png" alt="" draggable="false">
    </button>

    <button id="btn-usdc" class="crypto-btn" type="button" data-currency="USDC">
        <img src="assets/usdc.png" alt="" draggable="false">
    </button>

    <button id="btn-ton" class="crypto-btn" type="button" data-currency="TON">
        <img src="assets/ton.png" alt="" draggable="false">
    </button>

    <!-- Кнопки выбора языка -->
    <button id="btn-lang-en" class="lang-btn" type="button" data-lang="en">
        <img src="assets/english.png" alt="English" draggable="false">
    </button>

    <button id="btn-lang-ua" class="lang-btn" type="button" data-lang="ua">
        <img src="assets/українська.png" alt="Українська" draggable="false">
    </button>

    <button id="btn-lang-ru" class="lang-btn" type="button" data-lang="ru">
        <img src="assets/русский.png" alt="Русский" draggable="false">
    </button>


    <script>
        const paymentTexts = {
            ru: "Для того, чтобы внести оплату за ключ активации, для программы MASTERGEN ANALYZER, выберите, удобный для вас способ оплаты и скопируйте адрес кошелька.",
            ua: "Для того, щоб зробити оплату за ключ активації, для програми MASTERGEN ANALYZER, виберіть, зручний для вас спосіб оплати та скопіюйте адресу гаманця.",
            en: "To pay for the activation key for the MASTERGEN ANALYZER program, select, your preferred payment method and copy the wallet address."
        };

        const paymentInfoText = document.getElementById("payment-info-text");

        document.querySelectorAll(".lang-btn").forEach((button) => {
            button.addEventListener("click", () => {
                paymentInfoText.textContent = paymentTexts[button.dataset.lang];
            });
        });
    </script>

</body>
</html>
